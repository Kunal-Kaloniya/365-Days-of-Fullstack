on:
  push:
    paths:
      - 'services/orders-service/**' # Only trigger if this folder changes

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: cd services/orders-service && npm install
      - name: Run Tests
        run: cd services/orders-service && npm test
      - name: Build Docker Image
        run: |
          docker build -t my-app/orders:${{ github.sha }} ./services/orders-service