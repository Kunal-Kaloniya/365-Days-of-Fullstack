apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: LoadBalancer # Exposes the service to the internet
  selector:
    app: my-api    # Must match the label in your Deployment!
  ports:
    - protocol: TCP
      port: 80       # Port the Load Balancer listens on
      targetPort: 8080 # Port your Container is listening on